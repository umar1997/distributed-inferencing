# Step 2: 1 master + 2 workers on one laptop.
#
#   docker compose -f docker/docker-compose.yml up --build -d
#   DTYPE=fp32 docker compose -f docker/docker-compose.yml up -d     # other number format
#
# The weights go into the named volume "models": downloaded once by "prepare", then shared.
# Workers register themselves with the master (MASTER_ADDR) and send heartbeats; start order
# does not matter. Short health timings for tests: DEAD_AFTER_S=4 ... docker compose up -d

name: moe

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: moe-node:dev
  volumes:
    - models:/models

x-env: &env
  MODEL_ID: ibm-granite/granite-3.0-1b-a400m-instruct
  MODEL_REVISION: ffec3c35bdfd97a06f0b4cd5fcc92cd9b1584445
  DTYPE: ${DTYPE:-bf16}
  CLUSTER_TOKEN: ${CLUSTER_TOKEN:-change-me-dev-token}

x-worker-env: &worker-env
  <<: *env
  NODE_ROLE: worker
  LISTEN_PORT: 8100
  MASTER_ADDR: http://master:8000
  TORCH_THREADS: ${WORKER_THREADS:-2}
  REGISTER_RETRY_MAX_S: ${REGISTER_RETRY_MAX_S:-10}

services:
  prepare:
    <<: *node
    command: ["python", "-m", "moe_dist.prepare"]
    environment:
      <<: *env
    restart: "no"

  master:
    <<: *node
    environment:
      <<: *env
      NODE_ROLE: master
      NODE_ID: master
      LISTEN_PORT: 8000
      EXPERT_IDS: "0-9"
      COMBINE_MODE: ${COMBINE_MODE:-exact}
      API_KEY: ${API_KEY:-}  # empty: the OpenAI-style API needs no key
      MAX_QUEUE: ${MAX_QUEUE:-16}
      TORCH_THREADS: ${MASTER_THREADS:-4}
      HEARTBEAT_INTERVAL_S: ${HEARTBEAT_INTERVAL_S:-2}
      PING_INTERVAL_S: ${PING_INTERVAL_S:-3}
      SLOW_RTT_MS: ${SLOW_RTT_MS:-250}
      DEAD_AFTER_S: ${DEAD_AFTER_S:-15}
      RECOVER_AFTER_OK: ${RECOVER_AFTER_OK:-3}
      EXPERT_CALL_TIMEOUT_S: ${EXPERT_CALL_TIMEOUT_S:-5}
    ports:
      - "8000:8000"
    depends_on:
      prepare:
        condition: service_completed_successfully

  worker-1:
    <<: *node
    environment:
      <<: *worker-env
      NODE_ID: worker-1
      ADVERTISE_ADDR: http://worker-1:8100
      EXPERT_IDS: "10-20"
    cap_add: [NET_ADMIN]  # lets tests add network delay with `tc` (tests/test_failures.py)
    depends_on:
      prepare:
        condition: service_completed_successfully

  worker-2:
    <<: *node
    environment:
      <<: *worker-env
      NODE_ID: worker-2
      ADVERTISE_ADDR: http://worker-2:8100
      EXPERT_IDS: "21-31"
    cap_add: [NET_ADMIN]  # lets tests add network delay with `tc` (tests/test_failures.py)
    depends_on:
      prepare:
        condition: service_completed_successfully

volumes:
  models:
